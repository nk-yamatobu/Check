<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カルシウム自己チェック表 | 骨の健康診断</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f0f7ff;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 102, 204, 0.1), 0 8px 10px -6px rgba(0, 102, 204, 0.05);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-800">

    <!-- Header -->
    <header class="bg-white border-b border-blue-100 shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold">
                    <i class="fa-solid fa-bone"></i>
                </div>
                <span class="font-bold text-lg text-blue-900">カルシウム自己チェック</span>
            </div>
            <span id="header-step" class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-200">
                準備中
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto w-full px-4 py-6 flex-grow flex flex-col justify-center">

        <!-- START SCREEN -->
        <div id="start-screen" class="bg-white rounded-3xl p-6 card-shadow text-center fade-in">
            <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-5 text-3xl">
                <i class="fa-solid fa-file-medical"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">カルシウム摂取量<br>かんたん診断</h1>
            <p class="text-gray-600 text-sm mb-6 leading-relaxed">
                日頃の食生活や生活習慣に関する簡単な質問に答えるだけで、あなたの1日の推定カルシウム摂取量が分かります。
            </p>
            
            <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-4 mb-6 text-left text-xs text-blue-900 space-y-1.5">
                <div class="flex items-center space-x-2 font-bold text-blue-900 mb-1">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>チェックのポイント</span>
                </div>
                <p>• 質問数：全10問（選択式）</p>
                <p>• 所要時間：約1〜2分</p>
                <p>• 診断結果と改善ポイントが即座に分かります</p>
            </div>

            <button onclick="startQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 transition text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 text-lg flex items-center justify-center space-x-2">
                <span>チェックを開始する</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden bg-white rounded-3xl p-6 card-shadow fade-in">
            <!-- Progress Bar -->
            <div class="mb-6">
                <div class="flex justify-between text-xs text-gray-500 mb-1.5 font-medium">
                    <span id="progress-text">質問 1 / 10</span>
                    <span id="progress-percent">10%</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>

            <!-- Question Card -->
            <div class="mb-6">
                <span id="question-category" class="inline-block px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-lg mb-2">
                    カテゴリ
                </span>
                <h2 id="question-text" class="text-xl font-bold text-gray-800 leading-snug">
                    質問内容がここに表示されます
                </h2>
            </div>

            <!-- Answer Options -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Dynamic options generated by JS -->
            </div>

            <!-- Back Button -->
            <div class="flex justify-between items-center pt-2 border-t border-gray-100">
                <button id="prev-btn" onclick="prevQuestion()" class="text-gray-400 hover:text-gray-600 text-sm font-medium flex items-center space-x-1 py-1 px-2 rounded-lg">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                    <span>前の質問に戻る</span>
                </button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden bg-white rounded-3xl p-6 card-shadow fade-in">
            <div class="text-center mb-6">
                <span class="text-xs font-bold tracking-wider text-blue-600 uppercase bg-blue-50 px-3 py-1 rounded-full border border-blue-100">診断結果</span>
                <h2 class="text-xl font-bold text-gray-800 mt-2">あなたのカルシウム摂取状態</h2>
            </div>

            <!-- Score Badge Box -->
            <div id="result-card" class="rounded-2xl p-6 text-center mb-6 border">
                <div class="text-sm font-semibold opacity-80 mb-1">合計得点</div>
                <div class="text-4xl font-extrabold mb-1"><span id="result-score">0</span> <span class="text-xl font-normal">点</span></div>
                <div class="text-xs py-1 px-3 rounded-full inline-block font-bold mb-3" id="result-intake-badge">
                    1日あたり推定量：約 0 mg
                </div>
                <h3 id="result-status" class="text-xl font-bold mb-2">判定結果</h3>
                <p id="result-description" class="text-xs leading-relaxed opacity-90">
                    解説テキスト
                </p>
            </div>

            <!-- Detail Advice Section -->
            <div class="space-y-4 mb-6">
                <h4 class="font-bold text-gray-800 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-lightbulb text-amber-500"></i>
                    <span>食生活改善のアドバイス</span>
                </h4>
                <div id="advice-list" class="space-y-2 text-xs text-gray-600">
                    <!-- Dynamic advice list -->
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-3">
                <button onclick="restartQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>もう一度チェックする</span>
                </button>
                <button onclick="shareResult()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition text-sm flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>結果テキストをコピー</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        メッセージ
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-400 border-t border-gray-100 bg-white">
        <p>© カルシウム自己チェック表 アプリ化プロジェクト</p>
    </footer>

    <script>
        // Question Data Structure based on Standard Calcium Intake Assessment
        const questions = [
            {
                category: "乳製品",
                text: "牛乳（コップ1杯 / 約200ml）を飲む頻度は？",
                options: [
                    { label: "ほぼ毎日飲む", score: 4 },
                    { label: "週に3〜4回飲む", score: 3 },
                    { label: "週に1〜2回飲む", score: 2 },
                    { label: "ほとんど飲まない", score: 1 }
                ]
            },
            {
                category: "乳製品",
                text: "ヨーグルト（1カップ / 約100g）を食べる頻度は？",
                options: [
                    { label: "ほぼ毎日食べる", score: 4 },
                    { label: "週に3〜4回食べる", score: 3 },
                    { label: "週に1〜2回食べる", score: 2 },
                    { label: "ほとんど食べない", score: 1 }
                ]
            },
            {
                category: "乳製品",
                text: "チーズ（スライス1枚、またはプロセスチーズ1個）を食べる頻度は？",
                options: [
                    { label: "ほぼ毎日食べる", score: 4 },
                    { label: "週に3〜4回食べる", score: 3 },
                    { label: "週に1〜2回食べる", score: 2 },
                    { label: "ほとんど食べない", score: 1 }
                ]
            },
            {
                category: "大豆製品",
                text: "豆腐・納豆・厚揚げなどの大豆製品を食べる頻度は？",
                options: [
                    { label: "ほぼ毎日食べる", score: 4 },
                    { label: "週に3〜4回食べる", score: 3 },
                    { label: "週に1〜2回食べる", score: 2 },
                    { label: "ほとんど食べない", score: 1 }
                ]
            },
            {
                category: "水産物",
                text: "小魚（しらす・シシャモ・サケ缶・骨ごと食べる魚）を食べる頻度は？",
                options: [
                    { label: "ほぼ毎日食べる", score: 4 },
                    { label: "週に3〜4回食べる", score: 3 },
                    { label: "週に1〜2回食べる", score: 2 },
                    { label: "ほとんど食べない", score: 1 }
                ]
            },
            {
                category: "野菜類",
                text: "小松菜・カブの葉・ほうれん草などの緑黄色野菜を食べる頻度は？",
                options: [
                    { label: "ほぼ毎日食べる", score: 4 },
                    { label: "週に3〜4回食べる", score: 3 },
                    { label: "週に1〜2回食べる", score: 2 },
                    { label: "ほとんど食べない", score: 1 }
                ]
            },
            {
                category: "海藻・乾物",
                text: "ひじき・わかめ・切干大根・ごまなどを食べる頻度は？",
                options: [
                    { label: "ほぼ毎日食べる", score: 4 },
                    { label: "週に3〜4回食べる", score: 3 },
                    { label: "週に1〜2回食べる", score: 2 },
                    { label: "ほとんど食べない", score: 1 }
                ]
            },
            {
                category: "生活習慣",
                text: "1日3食、規則正しく食事をとっていますか？",
                options: [
                    { label: "はい（ほぼ毎日3食）", score: 2 },
                    { label: "ときどき抜かすことがある", score: 1 },
                    { label: "不規則（欠食が多い）", score: 0 }
                ]
            },
            {
                category: "生活習慣",
                text: "日常的に運動やウォーキング（散歩など）を行っていますか？",
                options: [
                    { label: "習慣的に行っている（週2回以上）", score: 2 },
                    { label: "ときどき動く程度", score: 1 },
                    { label: "運動習慣はほとんどない", score: 0 }
                ]
            },
            {
                category: "生活習慣",
                text: "昼間に外出し、適度に日光（太陽光）を浴びていますか？",
                options: [
                    { label: "毎日15〜30分程度浴びている", score: 2 },
                    { label: "あまり外に出ない", score: 0 }
                ]
            }
        ];

        let currentQuestion = 0;
        let answers = [];

        // Elements
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const headerStep = document.getElementById('header-step');

        function startQuiz() {
            currentQuestion = 0;
            answers = [];
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const total = questions.length;
            
            // Update header & progress
            headerStep.innerText = `問 ${currentQuestion + 1} / ${total}`;
            document.getElementById('progress-text').innerText = `質問 ${currentQuestion + 1} / ${total}`;
            const percent = Math.round(((currentQuestion + 1) / total) * 100);
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            // Question info
            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-text').innerText = q.text;

            // Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-2xl border-2 border-gray-100 bg-gray-50 hover:bg-blue-50 hover:border-blue-300 transition duration-150 flex items-center justify-between group active:scale-[0.99]';
                btn.onclick = () => selectOption(opt.score);

                // Highlight if previously selected
                if (answers[currentQuestion] !== undefined && answers[currentQuestion] === opt.score) {
                    btn.className = 'w-full text-left p-4 rounded-2xl border-2 border-blue-500 bg-blue-50/80 transition duration-150 flex items-center justify-between group';
                }

                btn.innerHTML = `
                    <span class="text-sm font-semibold text-gray-700 group-hover:text-blue-900">${opt.label}</span>
                    <i class="fa-regular fa-circle text-gray-300 group-hover:text-blue-500 text-lg"></i>
                `;
                container.appendChild(btn);
            });

            // Back button state
            const prevBtn = document.getElementById('prev-btn');
            if (currentQuestion === 0) {
                prevBtn.classList.add('opacity-0', 'pointer-events-none');
            } else {
                prevBtn.classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        function selectOption(score) {
            answers[currentQuestion] = score;
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                calculateResult();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function calculateResult() {
            const totalScore = answers.reduce((sum, val) => sum + val, 0);

            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            headerStep.innerText = "診断完了";

            document.getElementById('result-score').innerText = totalScore;

            const resultCard = document.getElementById('result-card');
            const resultBadge = document.getElementById('result-intake-badge');
            const resultStatus = document.getElementById('result-status');
            const resultDesc = document.getElementById('result-description');
            const adviceList = document.getElementById('advice-list');

            let categoryData = {};

            // Classification criteria based on Calcium Self-Check PDF Standard Matrix:
            // 20+ -> 800mg+
            // 16-19 -> 600-800mg
            // 11-15 -> 400-600mg
            // 8-10 -> 300-400mg
            // <=7 -> <300mg
            if (totalScore >= 20) {
                categoryData = {
                    intake: "約 800 mg 以上 / 日",
                    status: "理想的な摂取量です！",
                    cardStyle: "bg-emerald-50 border-emerald-200 text-emerald-900",
                    badgeStyle: "bg-emerald-200 text-emerald-800",
                    desc: "骨の健康維持に必要なカルシウム量がしっかり摂れています。現在の素晴らしい食習慣・生活習慣をぜひ続けていきましょう。"
                };
            } else if (totalScore >= 16) {
                categoryData = {
                    intake: "約 600 〜 800 mg / 日",
                    status: "概ね良好（標準レベル）",
                    cardStyle: "bg-blue-50 border-blue-200 text-blue-900",
                    badgeStyle: "bg-blue-200 text-blue-800",
                    desc: "一般的な目安量を摂取できています。もう少しだけ牛乳・大豆製品・緑黄色野菜をプラスすると、さらに骨が丈夫になります。"
                };
            } else if (totalScore >= 11) {
                categoryData = {
                    intake: "約 400 〜 600 mg / 日",
                    status: "やや不足気味です",
                    cardStyle: "bg-amber-50 border-amber-200 text-amber-900",
                    badgeStyle: "bg-amber-200 text-amber-800",
                    desc: "日常的にカルシウムが少し不足しています。牛乳を1杯増やすか、小魚や豆腐などを意識的に料理に取り入れましょう。"
                };
            } else if (totalScore >= 8) {
                categoryData = {
                    intake: "約 300 〜 400 mg / 日",
                    status: "カルシウム不足です",
                    cardStyle: "bg-orange-50 border-orange-200 text-orange-900",
                    badgeStyle: "bg-orange-200 text-orange-800",
                    desc: "1日に必要なカルシウムの半分程度しか摂れていません。将来の骨粗しょう症予防のためにも、食生活の改善をスタートしましょう。"
                };
            } else {
                categoryData = {
                    intake: "約 300 mg 未満 / 日",
                    status: "深刻な不足状態です",
                    cardStyle: "bg-rose-50 border-rose-200 text-rose-900",
                    badgeStyle: "bg-rose-200 text-rose-800",
                    desc: "カルシウム摂取量がかなり低い状態です。乳製品・小魚・大豆製品の積極的な摂取と、運動や日光浴の習慣化が必要です。"
                };
            }

            // Apply card styling
            resultCard.className = `rounded-2xl p-6 text-center mb-6 border ${categoryData.cardStyle}`;
            resultBadge.className = `text-xs py-1 px-3 rounded-full inline-block font-bold mb-3 ${categoryData.badgeStyle}`;
            resultBadge.innerText = `1日の推定摂取量：${categoryData.intake}`;
            resultStatus.innerText = categoryData.status;
            resultDesc.innerText = categoryData.desc;

            // Generate specific advice cards
            adviceList.innerHTML = `
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <strong class="text-gray-800 block mb-0.5">🥛 乳製品の活用:</strong>
                    牛乳・ヨーグルト・チーズは吸収率が約40%と非常に高いため、手軽な補給源として最適です。
                </div>
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <strong class="text-gray-800 block mb-0.5">☀️ ビタミンDとの組み合わせ:</strong>
                    適度な日光浴や、魚類・キノコ類に含まれる「ビタミンD」を一緒に摂ることでカルシウムの吸収率が高まります。
                </div>
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <strong class="text-gray-800 block mb-0.5">🏃‍♂️ 運動による骨への刺激:</strong>
                    ウォーキングや軽いジャンプなどの運動で骨に負加重を与えることで、カルシウムの定着が促進されます。
                </div>
            `;
        }

        function restartQuiz() {
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            headerStep.innerText = "準備中";
        }

        function shareResult() {
            const score = document.getElementById('result-score').innerText;
            const status = document.getElementById('result-status').innerText;
            const text = `【カルシウム自己チェック結果】\n合計スコア：${score}点\n判定：${status}\n\n#カルシウムチェック #健康習慣`;
            
            // Clipboard copy with fallback
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("結果をクリップボードにコピーしました！");
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast("結果をクリップボードにコピーしました！");
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
